<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quên mật khẩu - Luxury Hotel</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      body {
        background:
          linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
          url("https://images.unsplash.com/photo-1566073771259-6a8506099945?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80")
            no-repeat center center/cover;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .container {
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(15px);
        padding: 40px;
        border-radius: 15px;
        width: 450px;
        box-shadow: 0 15px 25px rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: white;
        text-align: center;
      }
      h2 {
        margin-bottom: 20px;
        letter-spacing: 1px;
        color: #d4af37;
      }
      p {
        font-size: 14px;
        margin-bottom: 20px;
        color: #eee;
      }
      .input-group {
        margin-bottom: 20px;
        text-align: left;
      }
      .input-group label {
        display: block;
        margin-bottom: 5px;
        font-size: 14px;
      }
      .input-group input {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 5px;
        background: rgba(255, 255, 255, 0.2);
        color: white;
        outline: none;
        font-size: 16px;
      }
      .input-group input::placeholder {
        color: #ccc;
      }
      button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 5px;
        background: #d4af37;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
        margin-bottom: 15px;
      }
      button:hover {
        background: #b5952f;
      }
      .switch-form a {
        color: #d4af37;
        text-decoration: none;
        font-weight: bold;
      }
      .switch-form a:hover {
        text-decoration: underline;
      }
      #msgBox {
        margin-top: 15px;
        font-size: 14px;
        font-weight: bold;
        min-height: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>KHÔI PHỤC MẬT KHẨU</h2>
      <p>
        Nhập email bạn đã đăng ký, chúng tôi sẽ cấp lại một mật khẩu mới cho
        bạn.
      </p>
      <form id="forgotForm">
        <div class="input-group">
          <label>Email đăng ký</label>
          <input
            type="email"
            id="email"
            placeholder="Ví dụ: nguyenvana@gmail.com"
            required
          />
        </div>
        <button type="submit" id="btnSubmit">CẤP LẠI MẬT KHẨU</button>
        <div id="msgBox"></div>
      </form>
      <div class="switch-form">
        <a href="login.html">← Quay lại Đăng nhập</a>
      </div>
    </div>

    <script>
      const API_URL = "https://localhost:7182/api/KhachHang/quen-mat-khau";

      document
        .getElementById("forgotForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const email = document.getElementById("email").value;
          const msgBox = document.getElementById("msgBox");
          const btnSubmit = document.getElementById("btnSubmit");

          msgBox.style.color = "white";
          msgBox.innerText = "Đang xử lý...";
          btnSubmit.disabled = true;

          try {
            const res = await fetch(API_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(email),
            });

            if (res.ok) {
              const data = await res.json();
              msgBox.style.color = "#4cd137";
              msgBox.innerText = data.message;
            } else {
              const errorText = await res.text();
              msgBox.style.color = "#ff6b6b";
              msgBox.innerText = errorText;
            }
          } catch (err) {
            msgBox.style.color = "#ff6b6b";
            msgBox.innerText = "Lỗi kết nối đến máy chủ!";
          } finally {
            btnSubmit.disabled = false;
          }
        });
    </script>
  </body>
</html>
