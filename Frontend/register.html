<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký - Luxury Hotel</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      body {
        background:
          linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)),
          url("https://images.unsplash.com/photo-1566073771259-6a8506099945?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80")
            no-repeat center center/cover;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .container {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        padding: 30px 40px;
        border-radius: 15px;
        width: 450px;
        box-shadow: 0 15px 25px rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: white;
      }
      h2 {
        text-align: center;
        margin-bottom: 20px;
        letter-spacing: 1px;
      }
      .input-group {
        margin-bottom: 15px;
      }
      .input-group label {
        display: block;
        margin-bottom: 5px;
        font-size: 13px;
      }
      .input-group input {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 5px;
        background: rgba(255, 255, 255, 0.2);
        color: white;
        outline: none;
      }
      .input-group input::placeholder {
        color: #ddd;
      }
      button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 5px;
        margin-top: 10px;
        background: #d4af37;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
      }
      button:hover {
        background: #b5952f;
      }
      .switch-form {
        text-align: center;
        margin-top: 15px;
        font-size: 14px;
      }
      .switch-form a {
        color: #d4af37;
        text-decoration: none;
        font-weight: bold;
      }
      .switch-form a:hover {
        text-decoration: underline;
      }
      .message {
        margin-top: 15px;
        text-align: center;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>TẠO TÀI KHOẢN</h2>
      <form id="registerForm">
        <div class="input-group">
          <label>Họ và Tên</label>
          <input type="text" id="hoTen" placeholder="Nhập họ và tên" required />
        </div>
        <div class="input-group">
          <label>Số điện thoại</label>
          <input
            type="text"
            id="soDienThoai"
            placeholder="Nhập số điện thoại"
            required
          />
        </div>
        <div class="input-group">
          <label>Căn cước công dân / CMND</label>
          <input type="text" id="cmnd" placeholder="Nhập số CCCD" required />
        </div>
        <div class="input-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="Nhập email" required />
        </div>
        <div class="input-group">
          <label>Mật khẩu</label>
          <input
            type="password"
            id="password"
            placeholder="Tạo mật khẩu"
            required
            minlength="6"
          />
        </div>
        <button type="submit">ĐĂNG KÝ</button>
        <div class="message" id="msgBox"></div>

        <div class="switch-form">
          Đã có tài khoản? <a href="login.html">Đăng nhập ngay</a>
        </div>
      </form>
    </div>

    <script>
      const API_URL = "https://localhost:7182/api/KhachHang/dang-ky";

      document
        .getElementById("registerForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const msgBox = document.getElementById("msgBox");
          msgBox.style.color = "white";
          msgBox.innerText = "Đang xử lý...";

          const requestData = {
            hoTen: document.getElementById("hoTen").value,
            email: document.getElementById("email").value,
            matKhau: document.getElementById("password").value,
            soDienThoai: document.getElementById("soDienThoai").value,
            cmnd: document.getElementById("cmnd").value,
          };

          try {
            const response = await fetch(API_URL, {
              method: "POST",
              headers: {
                Accept: "application/json",
                "Content-Type": "application/json",
              },
              body: JSON.stringify(requestData),
            });

            if (response.ok) {
              msgBox.style.color = "#4cd137";
              msgBox.innerText =
                "Đăng ký thành công! Đang chuyển đến trang đăng nhập...";

              setTimeout(() => {
                window.location.href = "login.html";
              }, 2000);
            } else {
              // Xử lý lỗi
              const errorText = await response.text();
              msgBox.style.color = "#ff6b6b";
              msgBox.innerText = errorText;
            }
          } catch (error) {
            msgBox.style.color = "#ff6b6b";
            msgBox.innerText = "Không thể kết nối đến máy chủ!";
            console.error(error);
          }
        });
    </script>
  </body>
</html>
